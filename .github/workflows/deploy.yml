name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Backend
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/Caregiver
            git pull origin main
            cd frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/caregiver/
            cd ..
            chmod +x gradlew
            ./gradlew build -x test
            pkill -f 'Caregiver-0.0.1-SNAPSHOT.jar' || true
            sleep 2
            nohup java -jar build/libs/Caregiver-0.0.1-SNAPSHOT.jar \
              --spring.config.additional-location=file:./application-secret.properties \
              > backend.log 2>&1 &
            sleep 5
            curl -s -o /dev/null -w "%{http_code}" http://localhost:8081/api/ || echo "Backend starting..."
            echo "✅ Deployment completed!"
