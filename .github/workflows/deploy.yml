name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Build Backend
        run: |
          chmod +x gradlew
          ./gradlew build -x test

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/Caregiver
            git fetch origin
            git checkout main
            git reset --hard origin/main

            # Build frontend
            cd frontend
            npm install
            npm run build
            sudo cp -r dist/* /var/www/caregiver/
            cd ..

            # Build backend
            chmod +x gradlew
            ./gradlew build -x test

            # Stop Gradle daemon (ignore exit code)
            ./gradlew --stop > /dev/null 2>&1; true

            # Restart Spring Boot via systemd (caregiver.service), which also
            # auto-restarts the backend on crash and on server reboot. Do not
            # go back to a bare `nohup java -jar ...`: that leaves the process
            # unmanaged, so a crash or reboot silently takes the API down with
            # no recovery until someone manually SSHes in.
            sudo systemctl restart caregiver

            # Fail the deploy loudly if the new process didn't actually come up,
            # instead of reporting success while an old/dead build keeps serving.
            # Spring Boot takes 50s+ to start on this box, so poll instead of a
            # fixed short sleep.
            for i in $(seq 1 30); do
              if ss -ltn | grep -q ':8081 '; then
                echo "Deployment completed!"
                exit 0
              fi
              sleep 3
            done
            echo "ERROR: backend failed to bind port 8081 after restart" >&2
            sudo journalctl -u caregiver -n 50 --no-pager
            exit 1
