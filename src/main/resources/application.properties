spring.application.name=Caregiver
server.port=8081

# PostgreSQL 연결 설정
spring.datasource.url=jdbc:postgresql://localhost:5432/caregiver_db
spring.datasource.username=postgres
spring.datasource.password=789456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA 및 Hibernate 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Spring Security OAuth2 (Naver)
spring.security.oauth2.client.registration.naver.client-id=pcg1Ko8oJaweliNCYkpe
spring.security.oauth2.client.registration.naver.client-secret=hpTXmVYueK
spring.security.oauth2.client.registration.naver.redirect-uri={baseUrl}/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.naver.scope=name,email
spring.security.oauth2.client.registration.naver.client-name=Naver

spring.security.oauth2.client.provider.naver.authorization-uri=https://nid.naver.com/oauth2.0/authorize
